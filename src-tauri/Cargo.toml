[package]
name = "format-converter-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
format-converter = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tauri-build = { version = "2" }
