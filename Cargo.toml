[package]
name = "format-converter"
version = "0.1.0"
edition = "2021"

[lib]
name = "format_converter"
path = "src/lib.rs"

[[bin]]
name = "format-converter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.22"
rust_xlsxwriter = "0.64"
anyhow = "1"
tauri = { version = "2", features = [] }
